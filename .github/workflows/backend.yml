name: Backend CI

# Every pull request, and every push to main (i.e. after a merge).
on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks code.
permissions:
  contents: read

# A newer push to the same PR cancels the run that is now out of date.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Report every Node version's result, even if one fails.
      fail-fast: false
      matrix:
        # package.json says node >=20.19; prove it on each supported line.
        node: [20, 22, 24]

    # A throwaway MongoDB 7 for the database tests, on localhost:27017.
    # Standalone (not a replica set): the design needs no transactions.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Set, so the database tests run. If MongoDB were unreachable they would
      # fail (connecting throws), not skip: a green run means all tests ran.
      MONGO_URI_TEST: mongodb://localhost:27017/choplist_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Exactly what package-lock.json says; fails if it disagrees with package.json.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
